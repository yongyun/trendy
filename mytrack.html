    <!-- hero typewriter -->
    <script>
        (function () {
            "use strict";

            var heading = document.getElementById("heroTypewriter");
            if (!heading) return;

            var targets = [];

            function wrap(node) {
                var child = node.firstChild;
                while (child) {
                    var next = child.nextSibling;
                    if (child.nodeType === 3) {
                        var text = child.textContent;
                        var frag = document.createDocumentFragment();
                        for (var i = 0; i < text.length; i++) {
                            var span = document.createElement("span");
                            span.className = "tw-char";
                            span.textContent = text[i];
                            frag.appendChild(span);
                            targets.push(span);
                        }
                        node.replaceChild(frag, child);
                    } else if (child.nodeType === 1 && child.tagName === "IMG") {
                        targets.push(child);
                    } else if (child.nodeType === 1 && child.classList.contains("tw-block")) {
                        targets.push(child);
                    } else if (child.nodeType === 1) {
                        wrap(child);
                    }
                    child = next;
                }
            }

            wrap(heading);

            var cursor = document.createElement("span");
            cursor.className = "tw-cursor";
            heading.appendChild(cursor);

            window.startHeroTypewriter = function () {
                var delay = 60;
                targets.forEach(function (el, i) {
                    setTimeout(function () {
                        el.classList.add("tw-show");
                        el.parentNode.insertBefore(cursor, el.nextSibling);
                    }, i * delay);
                });
                setTimeout(function () {
                    cursor.classList.add("tw-cursor-stop");
                }, targets.length * delay + 300);
            };
        })();
    </script>

                dateEl.textContent = s.date;
                nameEl.textContent = s.name;
                orgEl.textContent = s.org;
                orgEl.style.display = s.org ? "" : "none";
                topicEl.textContent = s.topic;
                highlightEl.textContent = s.highlight;
                modal.classList.add("is-open");
                document.body.classList.add("modal-open");
            }

            function closeModal() {
                modal.classList.remove("is-open");
                document.body.classList.remove("modal-open");
            }

            document.querySelectorAll("[data-speaker]").forEach(function (row) {
                row.addEventListener("click", function (e) {
                    e.preventDefault();
                    openModal(parseInt(row.getAttribute("data-speaker"), 10));
                });
            });

            modal.querySelectorAll("[data-modal-close]").forEach(function (el) {
                el.addEventListener("click", closeModal);
            });

            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closeModal();
            });
        })();
    </script>

    <!-- cross-page scroll target -->
    <script>
        $(function () {
            "use strict";

            var match = window.location.hash.match(/^#scroll-(\d+)$/);
            if (!match) return;

            var target = document.querySelector('[data-scroll-index="' + match[1] + '"]');
            if (!target) return;

            // ScrollSmoother 的 effects 量測（含圖片版面）在頁面剛載入時還沒完成，
            // document.documentElement.scrollHeight 在那之前只等於視窗高度。
            // 這裡改成輪詢等它真正撐開到完整內容高度後才捲動，避免固定延遲時間
            // 太短（量測未完成，捲動距離被夾在 0）或太長造成不必要等待。
            // 全程不呼叫 ScrollTrigger.refresh()，才不會影響其他區塊既有的 pin 效果。
            var stableCount = 0;
            var lastHeight = -1;
            var attempts = 0;
            var maxAttempts = 40; // 40 * 150ms = 6s 保底上限

            var timer = setInterval(function () {
                attempts++;
                var h = document.documentElement.scrollHeight;
                if (h > window.innerHeight * 1.5 && h === lastHeight) {
                    stableCount++;
                } else {
                    stableCount = 0;
                }
                lastHeight = h;

                if (stableCount >= 2 || attempts >= maxAttempts) {
                    clearInterval(timer);
                    var smoother = typeof ScrollSmoother !== "undefined" ? ScrollSmoother.get() : null;
                    if (smoother) {
                        smoother.scrollTo(target, true, "top top");
                    } else {
                        target.scrollIntoView();
                    }
                }
            }, 150);
        });
    </script>

    <!-- in-page nav scroll (already on index.html, no reload happens) -->
    <script>
        $(function () {
            "use strict";

            $(document).on("click", '.navbar-nav .nav-link[href*="#scroll-"]', function (e) {
                var href = $(this).attr("href");
                var match = href.match(/#scroll-(\d+)$/);
                if (!match) return;

                var target = document.querySelector('[data-scroll-index="' + match[1] + '"]');
                if (!target) return;

                e.preventDefault();

                var smoother = typeof ScrollSmoother !== "undefined" ? ScrollSmoother.get() : null;
                if (smoother) {
                    smoother.scrollTo(target, true, "top top");
                } else {
                    target.scrollIntoView({ behavior: "smooth" });
                }

                if (history.pushState) {
                    history.pushState(null, "", "#scroll-" + match[1]);
                }

                $(".navbar-collapse").removeClass("show");
            });
        });
    </script>
